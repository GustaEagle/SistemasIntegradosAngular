<div class="main">
  <h1>João Elias — RA 218797<br>Gustavo Lopes — RA 219852</h1>

  @if (usuarioLogado()) {
    <input class="lg-text-input" #campoNovoItem (keyup.enter)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value=''">
    <button class="btn-primary" (click)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value=''">Adicionar Tarefa</button>

    <ul>
      @for (tarefaDoLoop of arrayDeTarefas(); track $index) {
        <li>
          <app-item [tarefa]="tarefaDoLoop" (removeTarefa)="DELETE_tarefa(tarefaDoLoop)" (modificaTarefa)="UPDATE_tarefa(tarefaDoLoop)"></app-item>
        </li>
      }
    </ul>
  }

  @if (!usuarioLogado()) {
    <input #username placeholder="nome" class="lg-text-input" />
    <BR>
    <input #password placeholder="senha" class="lg-text-input" type="password" />
    <button class="btn-primary" (click)="login(username.value, password.value)">Login</button>
  }
</div>
